# Perfil dev (predefinido): armazenamento no MinIO local (docker compose).
# Sem dependência de AWS — o bucket é criado pelo serviço minio-init do compose.
# MINIO_ENDPOINT é substituído para http://minio:9000 quando o backend corre
# dentro do compose; localhost:9000 serve para `mvn spring-boot:run` no host.
app:
  storage:
    s3-bucket: ${MINIO_BUCKET:pede-aqui-uploads}
    s3-region: us-east-1 # MinIO ignora a região, mas o SDK exige uma
    s3-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    s3-access-key: ${MINIO_ROOT_USER:minioadmin}
    s3-secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  delivery:
    # Dev-only default (never use in prod); override with APP_DELIVERY_CODE_HMAC_SECRET.
    code-hmac-secret: ${APP_DELIVERY_CODE_HMAC_SECRET:dev-only-delivery-code-hmac-secret}
  # Segredo LOCAL do cliente delivery-admin-service do realm de dev (keycloak/delivery-realm.json).
  # Só existe no perfil dev; em prod KEYCLOAK_ADMIN_CLIENT_SECRET é obrigatório (SEC-07).
  keycloak:
    admin:
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:delivery-admin-secret}
  # Sem PSP: a confirmação manual do pagamento mock só existe em dev (dono da encomenda ou OPS/ADMIN).
  payments:
    mock-confirmation:
      enabled: true

# Password LOCAL do Postgres do docker compose. Em prod DB_PASSWORD é obrigatório (SEC-07).
spring:
  datasource:
    password: ${DB_PASSWORD:delivery}
