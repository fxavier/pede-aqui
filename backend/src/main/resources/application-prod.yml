# Perfil prod: AWS S3 real. Sem valores por defeito — se AWS_S3_BUCKET ou
# AWS_REGION faltarem, o arranque falha imediatamente (fail-fast) em vez de
# assinar presigned URLs para um bucket errado.
# Credenciais: NÃO definir AWS_ACCESS_KEY_ID/SECRET no ambiente de prod se a
# instância tiver IAM role — a cadeia por defeito do SDK (instance role) é usada
# quando as keys estão ausentes (ver S3Config).
app:
  storage:
    s3-bucket: ${AWS_S3_BUCKET}
    s3-region: ${AWS_REGION}
    s3-endpoint: "" # vazio = AWS real (virtual-hosted style)
  # Fail-fast de segredos (SEC-07): application.yml não tem defaults para estes valores;
  # RequiredSecretsProperties (@Validated @NotBlank) impede o arranque se vierem vazios.
  secrets:
    db-password: ${spring.datasource.password:}
    keycloak-admin-client-secret: ${app.keycloak.admin.client-secret:}
    # APP_DELIVERY_CODE_HMAC_SECRET (chave HMAC dos PINs de entrega, INC-02): sem default em application.yml.
    code-hmac-secret: ${app.delivery.code-hmac-secret:}

# Swagger UI / OpenAPI desligados em produção (SEC-21).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator numa porta de gestão separada (SEC-19 / PROD-01): só a rede interna (Prometheus,
# orquestrador) a alcança, pelo que o scrape não precisa de token. A porta pública da API
# deixa de servir /actuator/*; as probes ficam em /livez e /readyz na porta pública
# (management.endpoint.health.probes.add-additional-paths, em application.yml).
# NÃO publicar MANAGEMENT_SERVER_PORT no ingress/load balancer.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8091}
