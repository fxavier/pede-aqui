spring:
  # dev (MinIO) salvo indicação em contrário; produção define SPRING_PROFILES_ACTIVE=prod.
  profiles:
    default: dev
  # Load the repo-root .env (KEY=VALUE) so local dev picks up AWS_* etc. without
  # exporting them into the shell. Optional + multiple paths to tolerate the run
  # working dir being the repo root, backend/, or backend/backend/. OS env vars
  # still win over these, so production (real env vars) is unaffected.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: delivery-marketplace
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery}
    username: ${DB_USERNAME:delivery}
    # Sem default aqui (SEC-07): o valor de dev está em application-dev.yml; prod exige DB_PASSWORD.
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # ADR-0002 / LAC-47: transactional events. Registry = JDBC table event_publication, owned by Flyway (V052), never
  # auto-created. Completed rows are marked (update) and purged by EventPublicationCleanupJob; incomplete ones are
  # resubmitted by EventPublicationRetryJob on one replica instead of on every restart (multi-replica safe).
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: update
      republish-outstanding-events-on-restart: false
  # LAC-46: scheduler threads for @Scheduled jobs (ShedLock keeps each job to one replica).
  task:
    scheduling:
      thread-name-prefix: job-
      pool:
        size: 2
  # LAC-51: Redis cache (vendorSearch, TTL 60 s em RedisConfig). Os testes usam none
  # (src/test/resources/config/application.yml); CACHE_TYPE=none desliga-a sem Redis.
  cache:
    type: ${CACHE_TYPE:redis}
    cache-names: vendorSearch
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/delivery}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/delivery}/protocol/openid-connect/certs

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Exposição: health público; metrics/prometheus só para ADMIN na porta da aplicação, ou sem token
# na porta de gestão interna quando MANAGEMENT_SERVER_PORT está definida (SEC-19, ver SecurityConfig).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # /livez e /readyz também na porta da aplicação: as probes continuam a funcionar quando o
        # actuator vive numa porta de gestão separada (MANAGEMENT_SERVER_PORT, ver application-prod.yml).
        add-additional-paths: true
  # LAC-50: histogram buckets for HTTP server latency (p95/p99 via histogram_quantile in Prometheus/Grafana),
  # bounded to 5 ms..10 s to keep the bucket count per series small.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  # LAC-50: Micrometer Tracing (OpenTelemetry bridge). traceId/spanId are always in the MDC (and so in the log line
  # and in ApiProblems.traceId); spans are only EXPORTED when MANAGEMENT_OTLP_TRACING_ENDPOINT is set
  # (e.g. http://otel-collector:4318/v1/traces). Do not declare management.otlp.tracing.endpoint here with an empty
  # default: Boot treats an empty value as "set" and would build an exporter with no URL.
  # Sampling: 10 % by default (prod), 100 % in application-dev.yml; override with TRACING_SAMPLING_PROBABILITY.
  # TRACING_ENABLED=false switches span export off (Boot 3.5 still mints trace ids for the MDC/problem bodies).
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  api-docs:
    path: /api-docs
    # springdoc >= 2.8 passou a emitir OpenAPI 3.1 por defeito; fixa 3.0 para manter o contrato publicado (INC-09).
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html

# LAC-50 / PROD-08: Spring Boot native structured logging (one JSON object per line, escaping and stack traces
# handled by Boot) instead of the hand-rolled logback pattern. Logstash format, renamed to keep the historical field
# names (ts, msg, logger) + app; every MDC key is a top-level field: correlationId, traceId, spanId, job, jobRunId.
# LOG_FORMAT=ecs|logstash|gelf switches format; application-dev.yml sets it empty (readable pattern) by default.
logging:
  level:
    com.delivery: INFO
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      exclude: "@version,level_value"
      rename:
        "[@timestamp]": ts
        "[message]": msg
        "[logger_name]": logger
      add:
        app: ${spring.application.name}

app:
  api-base-path: /api/v1
  # ADR-0001: tenant = operador do marketplace. O tenant do operador é criado por V045 com este id.
  # Clientes (CUSTOMER) não têm tenant_id no token: o tenant vem do client OIDC que emitiu o token (azp),
  # nunca do header X-Tenant-Id. Um client fora deste mapa não resolve tenant (403 tenant_required).
  # O arranque falha se o mapa estiver vazio ou se algum tenant referido não existir.
  tenancy:
    operator-tenant-id: ${APP_OPERATOR_TENANT_ID:5e6d0c1a-7b2f-4f3e-9c8a-0d1e2f3a4b5c}
    customer-clients:
      pede-aqui-web: ${app.tenancy.operator-tenant-id}
      pede-aqui-mobile: ${app.tenancy.operator-tenant-id}
  # ADR-0001 passo 3: os guards de comerciante resolvem o vendor por merchant_users (V049). O fallback legado
  # ("claim vendor_id, senão o único vendor do tenant") só serve perfis ainda sem linha em merchant_users.
  # Desligar (false) apenas quando backend/scripts/adr-0001-merchant-users-report.sql §4 devolver 0 nesse
  # ambiente; o passo 6 do ADR remove depois o código do fallback.
  merchant-scope:
    single-vendor-fallback-enabled: ${APP_MERCHANT_SCOPE_SINGLE_VENDOR_FALLBACK_ENABLED:true}
  # LAC-27: horários (vendor_opening_hours) e encerramentos (vendor_closures) avaliados neste fuso.
  # enforce-available-flag: também exigir vendors.available=true para aceitar encomendas. Desligado porque a
  # coluna nasce FALSE e ainda não há UI para a ligar — ligar só depois de rever esse valor em todas as lojas.
  store-availability:
    timezone: ${APP_STORE_TIMEZONE:Africa/Maputo}
    enforce-available-flag: ${APP_STORE_ENFORCE_AVAILABLE_FLAG:false}
  # LAC-64: vertical farmácia bloqueada até parecer jurídico/regulatório. Com false, produtos com receita ou da
  # vertical "pharmacy" são recusados no carrinho e no checkout (422 pharmacy_not_available).
  verticals:
    pharmacy:
      enabled: ${APP_VERTICALS_PHARMACY_ENABLED:false}
  # LAC-11: rate limiting distribuído (Bucket4j + Redis, ver RateLimitConfig). Token bucket por
  # (grupo, método + padrão de rota, conta = JWT sub | IP do cliente). capacity pedidos, reposto ao longo de period.
  # Vários grupos a casar → ganha o padrão mais específico. 429 rate_limited + Retry-After.
  # Redis em baixo → buckets locais por instância (não fail-open) + WARN + rate_limit_backend_errors_total.
  # trusted-proxies: IP/CIDR do ALB/proxy; só então X-Forwarded-For é usado (vazio = getRemoteAddr()).
  # Sobrepor um valor por ambiente: APP_RATE_LIMIT_GROUPS_CHECKOUT_CAPACITY=20, etc.
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    backend: ${APP_RATE_LIMIT_BACKEND:redis}
    redis-timeout: 500ms
    redis-connect-timeout: 2s
    trusted-proxies: ${APP_RATE_LIMIT_TRUSTED_PROXIES:}
    groups:
      # Registo anónimo de comerciantes e clientes (por IP): a primeira linha é o WAF (LAC-11 §1).
      registration:
        paths: [/api/v1/register, /api/v1/customers/register]
        methods: [POST]
        capacity: 5
        period: 15m
      # Conclusão de entrega com PIN: limita tentativas por estafeta em todas as entregas (o bloqueio por
      # entrega após app.delivery.max-code-attempts continua no DeliveryService).
      delivery-code:
        paths: [/api/v1/deliveries/*/complete]
        methods: [POST]
        capacity: 10
        period: 5m
      checkout:
        paths: [/api/v1/checkout, /api/v1/checkout/**]
        methods: [POST]
        capacity: 10
        period: 1m
      uploads:
        paths: [/api/v1/uploads/**]
        methods: [POST]
        capacity: 30
        period: 1m
      payments:
        paths:
          - /api/v1/payments/**
          - /api/v1/finance/refunds/**
          - /api/v1/sales/orders/*/refund
          - /api/v1/sales/orders/*/cancel
        capacity: 20
        period: 1m
      provisioning:
        paths: [/api/v1/provisioning/**]
        capacity: 20
        period: 1m
      # Cobertura herdada do limitador em memória (dispatch, entregas, tickets, admin, /me).
      sensitive:
        paths:
          - /api/v1/deliveries/**
          - /api/v1/dispatch-jobs/**
          - /api/v1/ops/**
          - /api/v1/support/tickets/**
          - /api/v1/admin/**
          - /api/v1/me
          - /api/v1/me/**
          - /api/v1/customers/me/**
          - /api/v1/couriers/me/**
        capacity: 120
        period: 1m
      # LAC-40: lotes de GPS do estafeta (1 lote a cada ~10 s em entrega; folga para reenvio de buffers).
      courier-location:
        paths: [/api/v1/couriers/me/locations]
        methods: [POST]
        capacity: 30
        period: 1m
      # Navegação pública: generoso, só trava scraping.
      browse:
        paths: [/api/v1/catalog/**, /api/v1/search/**]
        methods: [GET]
        capacity: 300
        period: 1m
  provisioning:
    max-tenants-per-hour: ${PROVISIONING_MAX_TENANTS_PER_HOUR:50}
    max-per-email-domain-per-hour: ${PROVISIONING_MAX_PER_EMAIL_DOMAIN_PER_HOUR:10}
  catalog:
    price-review:
      enabled: true          # false → all price edits apply in place, audit-only
      threshold-percent: 20  # |Δ%| strictly greater triggers moderation
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,http://localhost:4173}
  storage:
    s3-bucket: ${AWS_S3_BUCKET:delivery-marketplace-local}
    s3-region: ${AWS_REGION:us-east-1}
    s3-endpoint: ${AWS_S3_ENDPOINT:}
    # When set (e.g. from .env), used directly; otherwise the AWS default
    # credentials chain (env vars, ~/.aws profile, instance role) applies.
    s3-access-key: ${AWS_ACCESS_KEY_ID:}
    s3-secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presigned-url-expiration-seconds: ${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:900}
    # LAC-12: upload size caps (bytes). Signed into the presigned PUT and re-checked by HeadObject on link.
    max-image-bytes: ${APP_UPLOAD_MAX_IMAGE_BYTES:5242880}
    max-document-bytes: ${APP_UPLOAD_MAX_DOCUMENT_BYTES:10485760}
  keycloak:
    admin:
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:delivery}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:delivery-admin-service}
      # Sem default aqui (SEC-07): dev em application-dev.yml; prod exige KEYCLOAK_ADMIN_CLIENT_SECRET.
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  delivery:
    # Failed PIN submissions before the delivery code locks (OPS unlocks via /ops/deliveries/{id}/unlock-code).
    max-code-attempts: ${APP_DELIVERY_MAX_CODE_ATTEMPTS:5}
    # HMAC-SHA256 key for delivery PIN hashes. Empty here on purpose: only the dev profile has a
    # default; prod must set APP_DELIVERY_CODE_HMAC_SECRET or startup fails.
    code-hmac-secret: ${APP_DELIVERY_CODE_HMAC_SECRET:}
  checkout:
    # INC-12 compatibility window: accept POST /checkout without addressId (order gets no address
    # snapshot, response carries "Deprecation: true"). Set to false to close the window once every
    # client sends addressId — see docs/api/API-MIGRATION.md.
    legacy-without-address-enabled: ${APP_CHECKOUT_LEGACY_WITHOUT_ADDRESS_ENABLED:true}
  payments:
    mock-confirmation:
      enabled: false  # dev-only manual POST /payments/{id}/confirm; disabled → 404. Never enable in prod (AS-01)
  # LAC-46: scheduled jobs (JobSchedulingConfig + ShedLock). enabled=false turns the scheduler off (tests); each job
  # also has its own flag. Durations are ISO-8601.
  jobs:
    enabled: ${APP_JOBS_ENABLED:true}
    reservation-reconciler:
      enabled: ${APP_JOBS_RESERVATION_RECONCILER_ENABLED:true}
      interval: PT15M
      initial-delay: PT2M
      # Orders touched more recently than this are left to the request that is changing them.
      grace-period: PT10M
      batch-size: 200
    # W4-A (LAC-25): order timeouts — see app.orders.* for the timeout durations.
    payment-expiry:
      enabled: ${APP_JOBS_PAYMENT_EXPIRY_ENABLED:true}
      interval: PT1M
      initial-delay: PT1M
    acceptance-timeout:
      enabled: ${APP_JOBS_ACCEPTANCE_TIMEOUT_ENABLED:true}
      interval: PT1M
      initial-delay: PT1M
    # W5-B (LAC-42): BUSY sem entrega -> AVAILABLE; com app.courier-presence.enforce-timeout, AVAILABLE sem sinal -> OFFLINE.
    courier-presence-sweeper:
      enabled: ${APP_JOBS_COURIER_PRESENCE_SWEEPER_ENABLED:true}
      interval: PT1M
      initial-delay: PT1M
    # W5-B (LAC-40): apaga courier_location_history com mais de app.courier-location.history-retention (30 dias).
    courier-location-retention:
      enabled: ${APP_JOBS_COURIER_LOCATION_RETENTION_ENABLED:true}
      cron: "0 15 4 * * *"
      zone: Africa/Maputo
    event-publication-retry:
      enabled: true
      interval: PT1M
      older-than: PT5M
    event-publication-cleanup:
      enabled: true
      cron: "0 30 3 * * *"
      zone: Africa/Maputo
      retention: P7D
  # W5-B (LAC-40): GPS do estafeta — consentimento, filtros de qualidade, presença Redis e retenção do histórico.
  courier-location:
    # Versão do texto de consentimento aceite no onboarding; mudar obriga a novo consentimento.
    consent-version: ${APP_COURIER_LOCATION_CONSENT_VERSION:2026-10-v1}
    max-batch-size: 50
    max-accuracy-meters: 100
    max-speed-kmh: 120
    max-point-age: PT5M
    max-clock-skew: PT5M
    redis-enabled: ${APP_COURIER_LOCATION_REDIS_ENABLED:true}
    presence-ttl: PT2M
    history-retention: P30D
    retention-batch-size: 5000
    retention-max-batches: 200
  # W5-B (LAC-42): presença do estafeta (job courier-presence-sweeper).
  courier-presence:
    offline-after: PT2M
    # false até a app do estafeta enviar localizações (senão todos os estafetas online passam a OFFLINE após 2 min).
    enforce-timeout: ${APP_COURIER_PRESENCE_ENFORCE_TIMEOUT:false}
    batch-size: 200
  # W4-A (LAC-25): order lifecycle timeouts (ISO-8601), enforced by the payment-expiry / acceptance-timeout jobs.
  orders:
    # PAYMENT_PENDING longer than this after checkout -> CANCELLED (PAYMENT_EXPIRED), stock released, no refund.
    payment-timeout: ${APP_ORDERS_PAYMENT_TIMEOUT:PT20M}
    # PAYMENT_CONFIRMED not accepted by the vendor within this -> CANCELLED (VENDOR_TIMEOUT) + refund of the remainder.
    acceptance-timeout: ${APP_ORDERS_ACCEPTANCE_TIMEOUT:PT10M}
    timeout-batch-size: 200
  sales:
    status-override:
      enabled: false  # gated manual transition matrix; keep disabled unless explicitly requested
