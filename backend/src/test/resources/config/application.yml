# Test-only overrides, layered on top of the main application.yml (classpath:/config/ wins over classpath:/).
spring:
  cache:
    # No Redis in the test suite; caching is covered by SearchServiceCachingTest and VendorSearchCacheRedisTest.
    type: none
app:
  rate-limit:
    # LAC-11: per-instance buckets (no Redis in the suite); the Redis path is covered by RateLimiterRedisTest.
    backend: local
  jobs:
    # LAC-46: no background scheduler in tests; job beans exist and tests call run()/reconcile() directly.
    enabled: false
  courier-location:
    # LAC-40: no Redis in the suite; the GEO/presence writes are covered by CourierPresenceStoreRedisTest.
    redis-enabled: false
  settlement:
    # LAC-33: ledger listeners off in the suite (SQL-seeded orders have no payments and cleanups delete orders);
    # the settlement Postgres tests switch it on in their own context.
    enabled: false
