name: pede_aqui_courier_app
version: 1.0.0+1
publish_to: none

description: App Flutter para estafetas Pede Aqui em Moçambique, baseada nos ecrãs de referência fornecidos.

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^7.7.0
  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  flutter_appauth: ^11.0.0
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reference_screens/
