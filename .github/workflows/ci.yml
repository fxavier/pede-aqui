name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        run: cd backend && mvn clean verify
      # LAC-56: OpenApiContractExportTest (run by `mvn verify` above) writes backend/target/openapi.json.
      # The committed docs/api/openapi.json must match it byte for byte. A missing file means the test
      # was skipped (no Docker) and also fails here on purpose. Breaking-change gate: api-contract.yml.
      - name: OpenAPI contract up to date
        run: |
          if [ ! -f backend/target/openapi.json ]; then
            echo "::error::backend/target/openapi.json was not generated (OpenApiContractExportTest skipped or failed)"
            exit 1
          fi
          if ! diff -u docs/api/openapi.json backend/target/openapi.json; then
            echo "::error file=docs/api/openapi.json::OpenAPI contract is out of date. Regenerate it: see docs/api/README.md"
            exit 1
          fi
      - name: Upload generated OpenAPI contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/target/openapi.json
          if-no-files-found: ignore

  # LAC-18 / ADR-0004: Keycloak SMS-OTP provider. `verify` = unit tests + PhoneOtpKeycloakIT (real Keycloak
  # 26.8.1 container with the packaged jar and the repository realm; Docker is available on ubuntu-latest).
  keycloak-sms-otp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Keycloak SMS-OTP provider
        run: cd keycloak/extensions/sms-otp && mvn -B verify

  backoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pede-aqui-backoffice/package-lock.json
      - name: Backoffice checks
        run: cd pede-aqui-backoffice && npm ci && npm run validate && npm run build
        env:
          # CI placeholders only — non-secret values read at build time by next.config.mjs (CSP).
          # AUTH_SECRET is runtime-only and deliberately absent from CI.
          AUTH_URL: http://localhost:3000
          AUTH_KEYCLOAK_ISSUER: http://localhost:8081/realms/delivery
          AUTH_KEYCLOAK_ID: delivery-app
          API_BASE_URL: http://localhost:8080/api/v1

  delivery-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pede-aqui-delivery/package-lock.json
      - name: Delivery web checks
        run: cd pede-aqui-delivery && npm ci && npm run typecheck && npm test && npm run build

  delivery-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the apps are developed and verified with; floating
          # stable (3.47.x) needs intl ^0.20.3 and breaks `flutter pub get`.
          flutter-version: '3.29.3'
          cache: true
      - name: Delivery app checks
        run: cd pede_aqui_delivery_app && flutter pub get && flutter analyze && flutter test

  courier-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the apps are developed and verified with; floating
          # stable (3.47.x) needs intl ^0.20.3 and breaks `flutter pub get`.
          flutter-version: '3.29.3'
          cache: true
      - name: Courier app checks
        run: cd pede_aqui_courier_app && flutter pub get && flutter analyze && flutter test
