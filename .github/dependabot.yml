# Weekly dependency updates (LAC-52). Minor/patch bumps are grouped into one PR per ecosystem/directory.
# Semver-MAJOR updates are ignored for every ecosystem: majors are done as deliberate, manual
# increments (with the code/config migration they need), never auto-raised. This was added after
# Dependabot majors (TypeScript 7, Tailwind 4, eslint-config-next 16, React 19 types) turned main red.
# npm lockfiles must stay npm 10-compatible (CI runs Node 20 / npm 10; package.json pins
# "packageManager": "npm@10.x", which Dependabot honours).
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /pede-aqui-backoffice
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backoffice]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /pede-aqui-delivery
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directories:
      - /pede_aqui_delivery_app
      - /pede_aqui_courier_app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, mobile]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Local-stack images in docker-compose.yml (postgis, redis, keycloak, minio, prometheus, maven).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, infra]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
