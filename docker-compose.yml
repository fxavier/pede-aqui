services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    # Keycloak 26.8.1 + provider SMS-OTP (LAC-18, ADR-0004), construído a partir de keycloak/Dockerfile.
    # Depois de alterar keycloak/extensions/sms-otp: `docker compose build keycloak`.
    build:
      context: ./keycloak
    image: pede-aqui-keycloak:26.8.1-local
    command: start-dev --import-realm
    environment:
      # Keycloak 26 substitui KEYCLOAK_ADMIN/_PASSWORD (deprecados) pelas variáveis de bootstrap.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Chave HMAC dos códigos OTP por SMS (só dev; em produção vem de um secret, >= 32 caracteres).
      KC_SPI_AUTHENTICATOR__PEDE_AQUI_PHONE_OTP__HMAC_SECRET: dev-only-phone-otp-hmac-secret-change-me-0001
      # O stub de SMS escreve no log o número mascarado e o texto com o código mascarado. Para testar o login
      # por telemóvel localmente, pôr "true": o código passa a aparecer no log (só funciona em start-dev).
      KC_SPI_SMS_SENDER__LOG__REVEAL_CODE_IN_DEV_MODE: "false"
    ports:
      - "8081:8080"
    volumes:
      # Realm neutro (sem utilizadores humanos) + seed de utilizadores SÓ de dev. O import por directório
      # do Keycloak lê `<realm>-realm.json` e depois `<realm>-users-<n>.json` (por isso o nome no contentor).
      - ./keycloak/delivery-realm.json:/opt/keycloak/data/import/delivery-realm.json:ro
      - ./keycloak/dev-users.json:/opt/keycloak/data/import/delivery-users-0.json:ro

  # MinIO RELEASE.2024-10-13T13-34-11Z via o arquivo público (congelado) da Bitnami: `minio/minio` foi
  # removido do Docker Hub e `quay.io/minio/*` exige login. O entrypoint Bitnami arranca `minio server`
  # sozinho (API 9000, consola 9001, dados em /bitnami/minio/data) — não passar `command`.
  minio:
    image: bitnamilegacy/minio:2024.10.13-debian-12-r1
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cria o bucket usado pelo perfil dev do backend (application-dev.yml). Idempotente.
  minio-init:
    image: bitnamilegacy/minio-client:2024.10.8-debian-12-r1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/pede-aqui-uploads"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # Job backend-host (prometheus.yml): backend a correr no host (mvn spring-boot:run com MANAGEMENT_SERVER_PORT=8091).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- LAC-50: stack de observabilidade local, opt-in: `docker compose --profile observability up -d` ---
  # Não muda o `docker compose up` por defeito. O backend só exporta spans quando
  # MANAGEMENT_OTLP_TRACING_ENDPOINT está definido (ver docs/local-development.md, secção Observabilidade).
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (backend no host: http://localhost:4318/v1/traces)
    depends_on:
      - jaeger

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3030:3000"   # 3000 é o backoffice Next.js
    depends_on:
      - prometheus
      - jaeger

  backend:
    image: maven:3.9-eclipse-temurin-26
    working_dir: /workspace/backend
    command: mvn spring-boot:run
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/delivery
      DB_USERNAME: delivery
      DB_PASSWORD: delivery
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/delivery
      SPRING_DATA_REDIS_HOST: redis
      # Actuator numa porta de gestão interna (SEC-19/PROD-01): o Prometheus faz scrape em
      # backend:8091 sem token; esta porta não é publicada no host.
      MANAGEMENT_SERVER_PORT: "8091"
      # Storage: perfil dev (MinIO) por defeito — ver application-dev.yml.
      # O endpoint fica localhost:9000 (default) de propósito: o presign não
      # faz chamadas de rede e o browser é quem faz o PUT, a partir do host.
      # Para AWS real: SPRING_PROFILES_ACTIVE=prod + AWS_S3_BUCKET/AWS_REGION/keys.
    ports:
      - "8082:8080"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      prometheus:
        condition: service_started
